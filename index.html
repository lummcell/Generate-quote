<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Chat Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:
radial-gradient(circle at top,#2a2d44 0%,#0e1018 45%,#090b12 100%);
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#141824;
border:1px solid rgba(255,255,255,.06);
border-radius:24px;
padding:22px;
box-shadow:
0 20px 50px rgba(0,0,0,.45),
0 0 50px rgba(79,70,229,.15);
}

.logo{
display:flex;
align-items:center;
gap:12px;
margin-bottom:20px;
}

.logo-icon{
width:46px;
height:46px;
border-radius:14px;
background:linear-gradient(135deg,#7c3aed,#2563eb);
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
}

.logo h2{
font-size:20px;
font-weight:700;
}

.logo p{
font-size:13px;
color:#9ca3af;
}

.status{
margin-left:auto;
background:#12361d;
color:#7CFC8D;
padding:5px 12px;
border-radius:999px;
font-size:12px;
font-weight:600;
}

.group{
margin-top:18px;
}

.group label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

input,
textarea{
width:100%;
background:#1f2432;
border:1px solid rgba(255,255,255,.05);
border-radius:14px;
padding:14px;
color:#fff;
font-size:15px;
outline:none;
transition:.2s;
}

input:focus,
textarea:focus{
border-color:#4f46e5;
box-shadow:0 0 0 3px rgba(79,70,229,.2);
}

textarea{
resize:none;
height:120px;
}

.upload{
margin-top:15px;
height:150px;
border:2px dashed #4b5563;
border-radius:18px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
cursor:pointer;
transition:.2s;
}

.upload:hover{
border-color:#4f46e5;
background:rgba(79,70,229,.08);
}

.upload img{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
display:none;
margin-bottom:10px;
}

.upload span{
color:#9ca3af;
font-size:14px;
}

.btn{
width:100%;
margin-top:18px;
padding:15px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#4f46e5,#2563eb);
color:#fff;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

canvas{
display:none;
}

</style>
</head>
<body>

<div class="container">

<div class="logo">

<div class="logo-icon">💬</div>

<div>
<h2>Quote Chat Generator</h2>
<p>Create beautiful chat images</p>
<small style="color:#8b8b8b;font-size:12px;">
DEV BY <span style="color:#60a5fa;font-weight:700;">LummXD</span>
</small>

</div>

<div class="status">
READY
</div>

</div>
<div class="group">
<label>Username</label>
<input
type="text"
id="username"
placeholder="@username">
</div>

<div class="group">
<label>Display Name</label>
<input
type="text"
id="displayName"
placeholder="Nama pengguna">
</div>

<div class="group">
<label>Message</label>
<textarea
id="message"
placeholder="Tulis pesan di sini..."></textarea>
</div>

<div class="group">
<label>Foto Profil</label>

<label class="upload">

<img id="preview">

<span id="uploadText">
Klik untuk memilih foto
</span>

<input
type="file"
id="photo"
accept="image/*"
hidden>

</label>

</div>

<button
class="btn"
onclick="generateChat()">
⚡ Generate Image
</button>

<button
class="btn"
style="margin-top:10px;background:linear-gradient(135deg,#16a34a,#22c55e)"
onclick="downloadImage()">
⬇ Download PNG
</button>

<div
id="result"
style="margin-top:25px;text-align:center;display:none;">

<canvas
id="canvas"
width="800"
height="900"></canvas>

<img
id="output"
style="
width:100%;
border-radius:18px;
border:1px solid rgba(255,255,255,.08);
">

</div>

</div>

<script>

const photo=document.getElementById("photo");
const preview=document.getElementById("preview");
const uploadText=document.getElementById("uploadText");

let avatar=new Image();

photo.onchange=e=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(ev){

preview.src=ev.target.result;
preview.style.display="block";
uploadText.style.display="none";
avatar.src=ev.target.result;

}

reader.readAsDataURL(file);

}

document.querySelector(".upload").onclick=()=>{
photo.click();
}
function generateChat(){

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const username=document.getElementById("username").value || "@username";
const displayName=document.getElementById("displayName").value || "Username";
const message=document.getElementById("message").value || "Halo semuanya 👋";

canvas.width=800;
canvas.height=900;

ctx.fillStyle="#0f1117";
ctx.fillRect(0,0,800,900);

ctx.fillStyle="#1b1f2b";
roundRect(ctx,40,40,720,820,30);
ctx.fill();

if(avatar.src){

ctx.save();

ctx.beginPath();
ctx.arc(100,110,35,0,Math.PI*2);
ctx.clip();

ctx.drawImage(avatar,65,75,70,70);

ctx.restore();

}else{

ctx.beginPath();
ctx.fillStyle="#4f46e5";
ctx.arc(100,110,35,0,Math.PI*2);
ctx.fill();

}

ctx.fillStyle="#fff";
ctx.font="bold 28px Inter";
ctx.fillText(displayName,155,105);

ctx.fillStyle="#9ca3af";
ctx.font="20px Inter";
ctx.fillText(username,155,135);

ctx.fillStyle="#2b313d";
roundRect(ctx,80,190,560,180,24);
ctx.fill();

ctx.fillStyle="#fff";
ctx.font="26px Inter";

wrapText(ctx,message,110,235,500,36);

const img=document.getElementById("output");

img.src=canvas.toDataURL("image/png");

document.getElementById("result").style.display="block";

}

function roundRect(ctx,x,y,w,h,r){

ctx.beginPath();

ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);

ctx.closePath();

}

function wrapText(ctx,text,x,y,maxWidth,lineHeight){

const words=text.split(" ");

let line="";

for(let n=0;n<words.length;n++){

let test=line+words[n]+" ";

let width=ctx.measureText(test).width;

if(width>maxWidth && n>0){

ctx.fillText(line,x,y);

line=words[n]+" ";

y+=lineHeight;

}else{

line=test;

}

}

ctx.fillText(line,x,y);

}
function downloadImage(){

const img=document.getElementById("output");

if(!img.src){
alert("Silakan Generate Image terlebih dahulu.");
return;
}

const a=document.createElement("a");
a.href=img.src;
a.download="quote-chat.png";
a.click();

}

</script>

<div style="
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
font-size:12px;
color:#8b8b8b;
">
DEV By <span style="color:#60a5fa;font-weight:bold;">LummXD</span>
</div>

</body>
</html>
